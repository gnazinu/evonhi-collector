{{- if .Values.token.create -}}
{{- if not .Values.token.value -}}
{{- fail "token.value is required when token.create=true; either set it or switch to token.create=false with token.secretRef" -}}
{{- end }}
{{- if not .Values.hmacKey -}}
{{- fail "hmacKey is required when token.create=true (HMAC-SHA256 signing key shared with the control plane)" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "evo-collector.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "evo-collector.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.token.value | b64enc }}
  hmac-key: {{ .Values.hmacKey | b64enc }}
{{- end }}
