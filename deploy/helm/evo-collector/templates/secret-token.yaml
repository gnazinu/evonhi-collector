{{- if .Values.token.create -}}
{{- if not .Values.token.value -}}
{{- fail "token.value is required when token.create=true; either set it or switch to token.create=false with token.secretRef" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "evo-collector.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "evo-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.token.value | quote }}
{{- end }}
