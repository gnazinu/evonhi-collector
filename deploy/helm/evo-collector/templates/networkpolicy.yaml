{{- if .Values.networkPolicy.enabled -}}
{{- if not .Values.networkPolicy.egressCIDRs -}}
{{- fail "networkPolicy.enabled=true requires networkPolicy.egressCIDRs (the EvoNHI control-plane CIDRs). Refusing to default to an allow-all egress." -}}
{{- end -}}
{{- range .Values.networkPolicy.egressCIDRs -}}
{{- if eq (trim .) "0.0.0.0/0" -}}
{{- fail "networkPolicy.egressCIDRs must not be 0.0.0.0/0 — that defeats the policy. Use the specific control-plane CIDR(s)." -}}
{{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "evo-collector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "evo-collector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "evo-collector.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server (in-cluster discovery).
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # EvoNHI control plane.
    {{- with .Values.networkPolicy.egressCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
