apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "evo-collector.fullname" . }}
  labels:
    {{- include "evo-collector.labels" . | nindent 4 }}
rules:
  # Core API — strictly read-only metadata.
  - apiGroups: [""]
    resources:
      - serviceaccounts
      - pods
      - configmaps
      - namespaces
    verbs: ["get", "list", "watch"]
  {{- if .Values.rbac.allowSecretReading }}
  # Opt-in: Secrets metadata (.data is never read by the agent).
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
  {{- end }}
  # Workloads.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  # RBAC graph.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - clusterroles
      - rolebindings
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
