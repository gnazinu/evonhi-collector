apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "evo-collector.fullname" . }}
  labels:
    {{- include "evo-collector.labels" . | nindent 4 }}
rules:
  # Least privilege: exactly what internal/k8s/collector.go lists (enforced by
  # TestClusterRoleCoversEverythingTheAgentLists). get/list only, no watch.
  - apiGroups: [""]
    resources:
      - serviceaccounts
      - pods
      - services
    verbs: ["get", "list"]
  {{- if .Values.rbac.allowSecretReading }}
  # Opt-in: Secrets metadata (.data is never read by the agent).
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list"]
  {{- end }}
  # Workloads.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list"]
  # External exposure (entry points).
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list"]
  # RBAC graph.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - clusterroles
      - rolebindings
      - clusterrolebindings
    verbs: ["get", "list"]
